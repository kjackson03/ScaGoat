
name: Cortex CLI Image Scan

on:
  push:
    branches:
      - SCAPRDev
  workflow_dispatch:

env:
  CORTEX_API_KEY: ${{secrets.CORTEX_API_KEY}}
  CORTEX_API_KEY_ID: ${{secrets.CORTEX_API_KEY_ID}}
  CORTEX_API_URL: https://api-ms-cxsiamp.xdr.us.paloaltonetworks.com
  
jobs:
  cortex-code-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Image
      uses: actions/checkout@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Verify Node.js Version
      run: node -v

    - name: Install libhyperscan5 library
      run: |
        sudo apt update
        sudo apt install libhyperscan5

    - name: Download cortexcli
      run: |
        set -x
        crtx_resp=$(curl "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
          -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
          -H "Authorization: ${CORTEX_API_KEY}")
        crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
        curl -o cortexcli $crtx_url
        chmod +x cortexcli
        ./cortexcli --version

    - name: Log into Azure Container Registry
      uses: elgohr/acr-login-action@master
      with:
        service_principal: ${{ secrets.ACR_PRINCIPAL }}
        service_principal_password: ${{ secrets.ACR_PRINCIPAL_PASSWORD }}
        tenant: ${{ secrets.TENANT }}
        registry: ${{ secrets.REGISTRY }}
        repository: ${{ secrets.REPOSITORY }}

    - name: Run Cortex CLI Image Scan
      run: |
        ./cortexcli \
          --api-base-url "${CORTEX_API_URL}" \
          --api-key "${CORTEX_API_KEY}" \
          --api-key-id "${CORTEX_API_KEY_ID}" \
          image scan kjimages.azurecr.io/myubuntu:latest
      #    code scan \
      #    --directory "${{github.workspace}}" \
      #    --repo-id "${{github.repository}}" \
      #    --branch "${{github.ref_name}}" \
      #    --framework "sca" \
      #    --source "GITHUB_ACTIONS" \
      #    --create-repo-if-missing
